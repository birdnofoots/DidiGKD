name: build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # birdnofoots 通用固定签名(easycontrol)，与 Easycontrol/DidiWatch 同一把，
      # 确保 APK 之间可互相覆盖安装、更新不丢授权。
      - name: write keystore
        run: echo ${{ secrets.ANDROID_KEYSTORE_BASE64 }} | base64 --decode > ${{ github.workspace }}/didigkd.jks

      - run: ./gradlew :gkd-android:assembleGkdRelease
        env:
          GKD_STORE_FILE: ${{ github.workspace }}/didigkd.jks
          GKD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: didigkd-apk
          path: gkd-android/build/outputs/apk/gkd/release/*.apk
