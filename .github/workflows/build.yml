name: build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # 未提供 GKD_STORE_FILE 时, gkd-android/build.gradle.kts 自动 fallback 到 debug 签名
      # (AGP 的 debug keystore 由固定参数生成, 所有开发机内容一致 → 后续可覆盖安装)
      # 要换正式签名时: 设置 secrets ANDROID_KEYSTORE_BASE64 / _PASSWORD / _ALIAS / _KEY_PASSWORD
      # 并恢复下面的 write keystore 步骤与 env
      - run: ./gradlew :gkd-android:assembleGkdRelease

      - uses: actions/upload-artifact@v7
        with:
          name: didigkd-apk
          path: gkd-android/build/outputs/apk/gkd/release/*.apk
